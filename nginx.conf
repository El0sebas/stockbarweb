server {
    listen 80;
    root /usr/share/nginx/html;

    # La API en el mismo origen: el navegador nunca habla directo con MySQL
    # ni conoce la dirección interna de la API.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m; # facturas de compra (la API acepta hasta 5 MB)
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Aplicación de una sola página: cualquier otra ruta sirve index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
